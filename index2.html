<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Mirror</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* --- Base Magic Mirror Styles --- */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 30px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* --- Main Layout: Top Section (Left & Right) --- */
        .top-section {
            display: flex;
            justify-content: space-between;
            height: 85%;
            width: 100%;
        }

        /* --- Left Column: Clock & Stocks --- */
        .left-column {
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centers elements in the open space */
            align-items: center;
            width: 45%;
            height: 100%;
            padding-right: 20px;
        }

        /* --- Right Column: Weather Map --- */
        .right-column {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50%;
            height: 100%;
        }

        /* --- Common Border Styling (Emblems) --- */
        .module-border {
            border: 2px solid #333; /* Dark grey border */
            border-radius: 15px;
            padding: 25px;
            background: rgba(10, 10, 10, 0.6); /* Slight background to separate from pure black */
        }

        /* --- Top Left: Time & Date --- */
        .time-container {
            text-align: center;
            margin-bottom: 40px; /* Spacing between clock and stocks */
            width: 80%;
        }
        #time {
            font-family: 'Share Tech Mono', monospace; /* Digital Font */
            font-size: 7rem;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #date {
            font-size: 1.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Bottom Left: Stocks --- */
        .stock-container {
            width: 80%;
            text-align: center;
            opacity: 0.6; /* Slightly transparent/less bright */
        }
        .stock-header {
            font-size: 1rem;
            color: #666;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .stock-item {
            font-size: 2.2rem;
            display: flex;
            justify-content: space-around;
            align-items: center;
            animation: fade 5s infinite;
        }
        .stock-symbol {
            color: #aaa; /* Grey/White for company name */
            font-weight: bold;
        }
        .positive-data { color: #4caf50; } /* Green for up */
        .negative-data { color: #f44336; } /* Red for down */

        /* --- Right: Weather Map --- */
        .weather-container {
            width: 100%;
            height: 80%; /* Shrunk slightly for aesthetics */
            padding: 10px; /* Border padding */
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
            /* CSS Filter trick to create a dark, desaturated map while keeping some storm brightness */
            filter: grayscale(60%) invert(95%) hue-rotate(180deg) contrast(150%);
        }

        /* --- Bottom Section: Greeting --- */
        .bottom-section {
            height: 15%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        #greeting {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 3px;
            opacity: 0.3; /* Large but transparent */
            text-transform: lowercase;
            margin-bottom: 10px;
        }

        @keyframes fade {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="top-section">
        <div class="left-column">
            <div class="time-container module-border">
                <div id="time">00:00:00</div>
                <div id="date">Loading...</div>
            </div>

            <div class="stock-container module-border">
                <div class="stock-header">Market Watch</div>
                <div id="stock-display" class="stock-item">Loading...</div>
            </div>
        </div>

        <div class="right-column">
            <div class="weather-container module-border">
                <iframe src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=in&metricTemp=f&metricWind=mph&zoom=8&overlay=radar&product=radar&marker=true&lat=42.03&lon=-93.62"></iframe>
            </div>
        </div>
    </div>

    <div class="bottom-section">
        <div id="greeting">loading...</div>
    </div>

    <script>
        // --- 1. Clock, Date, and Greeting Logic ---
        function updateTimeAndGreeting() {
            const now = new Date();
            
            // Time
            const timeOptions = { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: false }; // Set hour12: true for AM/PM
            document.getElementById('time').textContent = now.toLocaleTimeString('en-US', timeOptions);
            
            // Date
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', dateOptions);

            // Personalized Greeting based on hour
            const hour = now.getHours();
            let greetingText = "";
            if (hour >= 5 && hour < 12) {
                greetingText = "Good Morning Rohan";
            } else if (hour >= 12 && hour < 17) {
                greetingText = "Good Afternoon Rohan";
            } else {
                greetingText = "Good Evening Rohan";
            }
            document.getElementById('greeting').textContent = greetingText;
        }
        
        setInterval(updateTimeAndGreeting, 1000);
        updateTimeAndGreeting();

        // --- 2. Rotating Stocks Logic ---
        const stocks = [
            { symbol: "AAPL", price: "185.92", change: "1.2%", isUp: true },
            { symbol: "MSFT", price: "402.56", change: "0.8%", isUp: true },
            { symbol: "TSLA", price: "194.05", change: "2.1%", isUp: false },
            { symbol: "AMZN", price: "174.12", change: "1.5%", isUp: true }
        ];
        
        let stockIndex = 0;
        function rotateStocks() {
            const stock = stocks[stockIndex];
            const stockElement = document.getElementById('stock-display');
            
            // Determine styling and arrow direction based on isUp boolean
            const colorClass = stock.isUp ? 'positive-data' : 'negative-data';
            const arrow = stock.isUp ? '&#9650;' : '&#9660;'; // HTML entity for Up/Down solid triangles
            const sign = stock.isUp ? '+' : '-';

            // Constructing the HTML structure for the stock item
            stockElement.innerHTML = `
                <span class="stock-symbol">${stock.symbol}</span> 
                <span class="${colorClass}">${arrow} $${stock.price} (${sign}${stock.change})</span>
            `;
            
            stockIndex = (stockIndex + 1) % stocks.length;
        }
        
        setInterval(rotateStocks, 5000); 
        rotateStocks();
    </script>
</body>
</html>
