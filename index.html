<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Mirror</title>
    
    <!-- Google Digital Font -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* --- Base Magic Mirror Styles --- */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 30px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* --- Top Layout: Left & Right Columns --- */
        .top-section {
            display: flex;
            justify-content: space-between;
            height: 85%;
            width: 100%;
        }

        /* --- Left Column: Clock & Stocks --- */
        .left-column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 45%;
            height: 100%;
            padding-right: 20px;
        }

        /* --- Right Column: Weather Map --- */
        .right-column {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50%;
            height: 100%;
        }

        /* --- Emblem Border Styling --- */
        .module-border {
            border: 2px solid #333;
            border-radius: 15px;
            padding: 25px;
            background: rgba(10, 10, 10, 0.6);
        }

        /* --- Time & Date Module --- */
        .time-container {
            text-align: center;
            margin-bottom: 40px;
            width: 80%;
        }
        #time {
            font-family: 'Share Tech Mono', monospace;
            font-size: 7rem;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        #date {
            font-size: 1.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- Stock Ticker Module --- */
        .stock-container {
            width: 80%;
            text-align: center;
            opacity: 0.65;
        }
        .stock-header {
            font-size: 1rem;
            color: #666;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .stock-item {
            font-size: 2.2rem;
            display: flex;
            justify-content: space-around;
            align-items: center;
            animation: fade 5s infinite;
        }
        .stock-symbol {
            color: #aaa;
            font-weight: bold;
        }
        .positive-data { color: #4caf50; }
        .negative-data { color: #f44336; }

        /* --- Weather Map Module (Pure Grayscale) --- */
        .weather-container {
            width: 100%;
            height: 80%;
            padding: 10px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
            /* Entirely Grayscale Filter */
            filter: grayscale(100%) invert(90%) contrast(150%);
        }

        /* --- Bottom Greeting Section --- */
        .bottom-section {
            height: 15%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        #greeting {
            font-size: 3.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 0.35;
            text-align: center;
            margin-bottom: 10px;
        }

        @keyframes fade {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="top-section">
        <!-- Left Column -->
        <div class="left-column">
            <div class="time-container module-border">
                <div id="time">00:00:00</div>
                <div id="date">Loading...</div>
            </div>

            <div class="stock-container module-border">
                <div class="stock-header">Market Watch</div>
                <div id="stock-display" class="stock-item">Loading...</div>
            </div>
        </div>

        <!-- Right Column -->
        <div class="right-column">
            <div class="weather-container module-border">
                <iframe src="https://embed.windy.com/embed.html?type=map&location=coordinates&metricRain=in&metricTemp=f&metricWind=mph&zoom=8&overlay=radar&product=radar&marker=true&lat=42.03&lon=-93.62"></iframe>
            </div>
        </div>
    </div>

    <!-- Bottom Greeting -->
    <div class="bottom-section">
        <div id="greeting">Loading...</div>
    </div>

    <script>
        // --- 1. Quarterly Prompt Bank ---
        const quarterlyPrompts = {
            q1: [ // 00:00 - 05:59 (Early Morning / Night)
                "Good early morning, Rohan. May your rest be restorative.",
                "Good early morning, Rohan. Focus on recovery and peace.",
                "Good early morning, Rohan. Preparing for a productive day ahead.",
                "Good early morning, Rohan. A quiet start to the day."
            ],
            q2: [ // 06:00 - 11:59 (Morning)
                "Good morning, Rohan. Wishing you a focused and successful day.",
                "Good morning, Rohan. Prioritize your key objectives today.",
                "Good morning, Rohan. Maintain momentum and clarity.",
                "Good morning, Rohan. Prepared to make meaningful progress."
            ],
            q3: [ // 12:00 - 17:59 (Afternoon)
                "Good afternoon, Rohan. Stay consistent and driven.",
                "Good afternoon, Rohan. Keep up the strong momentum.",
                "Good afternoon, Rohan. Review your progress and finish strong.",
                "Good afternoon, Rohan. Focused effort yields great results."
            ],
            q4: [ // 18:00 - 23:59 (Evening)
                "Good evening, Rohan. Reflect on today's accomplishments.",
                "Good evening, Rohan. Time to wind down and recharge.",
                "Good evening, Rohan. Great work on today's efforts.",
                "Good evening, Rohan. Prepare for a restful night."
            ]
        };

        let currentQuarter = -1;

        function updateQuarterlyPrompt(hour) {
            let quarterKey = "";
            let quarterIndex = 0;

            if (hour >= 0 && hour < 6) {
                quarterKey = "q1";
                quarterIndex = 1;
            } else if (hour >= 6 && hour < 12) {
                quarterKey = "q2";
                quarterIndex = 2;
            } else if (hour >= 12 && hour < 18) {
                quarterKey = "q3";
                quarterIndex = 3;
            } else {
                quarterKey = "q4";
                quarterIndex = 4;
            }

            // Only update prompt if a new quarter is reached or on page load
            if (currentQuarter !== quarterIndex) {
                currentQuarter = quarterIndex;
                const bank = quarterlyPrompts[quarterKey];
                const randomIndex = Math.floor(Math.random() * bank.length);
                document.getElementById('greeting').textContent = bank[randomIndex];
            }
        }

        // --- 2. Time & Date Logic ---
        function updateTime() {
            const now = new Date();
            
            // Format Digital Clock
            const timeOptions = { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('time').textContent = now.toLocaleTimeString('en-US', timeOptions);
            
            // Format Date
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', dateOptions);

            // Check and update prompt based on current hour
            updateQuarterlyPrompt(now.getHours());
        }
        
        setInterval(updateTime, 1000);
        updateTime();

        // --- 3. Rotating Stock Ticker Logic ---
        const stocks = [
            { symbol: "AAPL", price: "185.92", change: "1.2%", isUp: true },
            { symbol: "MSFT", price: "402.56", change: "0.8%", isUp: true },
            { symbol: "TSLA", price: "194.05", change: "2.1%", isUp: false },
            { symbol: "AMZN", price: "174.12", change: "1.5%", isUp: true }
        ];
        
        let stockIndex = 0;
        function rotateStocks() {
            const stock = stocks[stockIndex];
            const stockElement = document.getElementById('stock-display');
            
            const colorClass = stock.isUp ? 'positive-data' : 'negative-data';
            const arrow = stock.isUp ? '&#9650;' : '&#9660;';
            const sign = stock.isUp ? '+' : '-';

            stockElement.innerHTML = `
                <span class="stock-symbol">${stock.symbol}</span> 
                <span class="${colorClass}">${arrow} $${stock.price} (${sign}${stock.change})</span>
            `;
            
            stockIndex = (stockIndex + 1) % stocks.length;
        }
        
        setInterval(rotateStocks, 5000); 
        rotateStocks();
    </script>
</body>
</html>
